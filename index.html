<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />

  <!-- lib (глобальные) -->
  <script src="./lib/jquery-3.7.1.min.js"></script>
  <script src="./lib/MC.min.js"></script>

  <script type="module">
    import App from './app.js';

    // Инициализация MC (глобальная функция/объект)
    MC.init();

    document.addEventListener('DOMContentLoaded', () => {
      // $ доступен глобально
      $("#root").append($.MC(App));
    });
  </script>

  <title>MCv7</title>
</head>
<body>
  <div id="root"></div>
</body>
</html>
